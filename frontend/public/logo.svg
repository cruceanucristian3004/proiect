<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with cracks and spikes -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#000000" stroke-width="8" />
  
  <!-- Spikes/cracks on the border -->
  <path d="M 100 10 L 105 20 L 100 25 Z" fill="#000000" />
  <path d="M 190 100 L 180 105 L 175 100 Z" fill="#000000" />
  <path d="M 100 190 L 95 180 L 100 175 Z" fill="#000000" />
  <path d="M 10 100 L 20 95 L 25 100 Z" fill="#000000" />
  <path d="M 145 35 L 150 45 L 145 50 Z" fill="#000000" />
  <path d="M 165 165 L 155 160 L 150 165 Z" fill="#000000" />
  <path d="M 35 145 L 45 150 L 50 145 Z" fill="#000000" />
  <path d="M 35 55 L 50 50 L 45 40 Z" fill="#000000" />
  
  <!-- Upward arrow in bottom right (as part of border) -->
  <path d="M 160 170 L 190 140 L 185 135 L 170 150 L 175 145 L 170 140 L 160 150 Z" fill="#000000" />
  <path d="M 175 145 L 190 130 L 180 125 L 175 130 Z" fill="#000000" />
  
  <!-- NOVA text with dripping effect -->
  <text x="100" y="70" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="#000000">
    NOVA
  </text>
  <!-- Dripping effect for NOVA -->
  <path d="M 55 75 L 57 85 L 55 85 Z" fill="#000000" />
  <path d="M 72 75 L 74 82 L 72 82 Z" fill="#000000" />
  <path d="M 90 75 L 92 88 L 90 88 Z" fill="#000000" />
  <path d="M 110 75 L 112 83 L 110 83 Z" fill="#000000" />
  <path d="M 128 75 L 130 86 L 128 86 Z" fill="#000000" />
  <path d="M 145 75 L 147 80 L 145 80 Z" fill="#000000" />
  
  <!-- RESELLS text with dripping effect -->
  <text x="100" y="110" font-family="Arial Black, sans-serif" font-size="24" font-weight="900" text-anchor="middle" fill="#000000">
    RESELLS
  </text>
  <!-- Dripping effect for RESELLS -->
  <path d="M 55 115 L 57 125 L 55 125 Z" fill="#000000" />
  <path d="M 75 115 L 77 123 L 75 123 Z" fill="#000000" />
  <path d="M 92 115 L 94 128 L 92 128 Z" fill="#000000" />
  <path d="M 108 115 L 110 122 L 108 122 Z" fill="#000000" />
  <path d="M 125 115 L 127 126 L 125 126 Z" fill="#000000" />
  <path d="M 142 115 L 144 120 L 142 120 Z" fill="#000000" />
  <path d="M 155 115 L 157 124 L 155 124 Z" fill="#000000" />
  
  <!-- Spray paint can -->
  <g transform="translate(65, 130)">
    <!-- Can body -->
    <rect x="0" y="10" width="30" height="35" fill="#000000" rx="3" />
    <!-- Can top -->
    <ellipse cx="15" cy="10" rx="15" ry="5" fill="#000000" />
    <!-- Nozzle -->
    <rect x="13" y="5" width="4" height="5" fill="#000000" />
    <!-- Spray cloud from nozzle -->
    <ellipse cx="25" cy="8" rx="8" ry="6" fill="#000000" opacity="0.7" />
    <ellipse cx="30" cy="12" rx="6" ry="8" fill="#000000" opacity="0.6" />
    <ellipse cx="32" cy="18" rx="5" ry="7" fill="#000000" opacity="0.5" />
    <!-- Drips from spray cloud -->
    <path d="M 28 14 L 30 18 L 28 18 Z" fill="#000000" />
    <path d="M 33 19 L 35 22 L 33 22 Z" fill="#000000" />
    <!-- Crack with arrow on can -->
    <path d="M 15 15 L 20 20 L 15 25 Z" fill="none" stroke="#ffffff" stroke-width="2" />
    <path d="M 18 18 L 22 22 M 22 18 L 18 22" stroke="#ffffff" stroke-width="1.5" />
    <path d="M 17 22 L 20 19 L 17 16 Z" fill="#ffffff" />
  </g>
</svg>